server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: easy-crm-backend
  profiles:
    # local 存放本机私有配置（数据库密码等，已 gitignore），缺失不影响启动
    active: dev,local
  jackson:
    time-zone: Asia/Shanghai

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding=utf8 由驱动映射为服务端 utf8mb4；连接参数不能直接写 utf8mb4（非合法 Java 字符集名）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:easy_crm}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    # 密码不落仓库：由环境变量 MYSQL_PASSWORD 注入，或写在 gitignore 的 application-local.yml
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  configuration:
    # 数据库下划线字段自动映射到实体驼峰属性（create_time -> createTime）
    map-underscore-to-camel-case: true
    # SQL 日志走 SLF4J，由下方 logging 级别控制开关（DEBUG 时输出 SQL）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 主键统一采用数据库自增（全库约定）
      id-type: auto
      # 逻辑删除：deleted 字段，0 未删除 / 1 已删除
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

easy-crm:
  jwt:
    # 生产环境通过环境变量 JWT_SECRET 注入，长度至少 32 字节
    secret: ${JWT_SECRET:easy-crm-backend-dev-only-secret-key-0123456789abcdef}
    issuer: easy-crm-backend
    admin-expire: 12h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# 日志级别
logging:
  level:
    root: INFO
    # 业务代码：DEBUG 时配合 log-impl 输出 SQL 明细，排查数据权限注入效果时调到这里
    com.easykits.crm: INFO
    com.easykits.crm.**.mapper: DEBUG
    org.springframework.web: INFO
    org.springframework.jdbc: WARN
    com.baomidou.mybatisplus: WARN
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{40} - %msg%n"
